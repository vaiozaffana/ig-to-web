services:
  redis:
    image: redis:8-alpine

  whatsapp:
    build: ./whatsapp-service
    ports:
      - "3001:3001"
    volumes:
      - whatsapp-auth:/app/auth_info_baileys
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build: .
    command: sh -c "uv run python -m app.scripts.ensure_migrations && uv run alembic upgrade head && uv run fastapi run app/main.py --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:///./data/ig_automation.db
      WHATSAPP_SERVICE_URL: http://whatsapp:3001
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
    volumes:
      - .:/app
      - sqlite-data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - whatsapp

  worker:
    build: .
    command: uv run celery -A app.modules.tasks.celery_app.celery_app worker --loglevel=INFO --concurrency=1
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:///./data/ig_automation.db
      WHATSAPP_SERVICE_URL: http://whatsapp:3001
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
    volumes:
      - .:/app
      - sqlite-data:/app/data
    depends_on:
      - redis
      - whatsapp

  beat:
    build: .
    command: uv run celery -A app.modules.tasks.beat_schedule.celery_app beat --loglevel=INFO
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:///./data/ig_automation.db
      WHATSAPP_SERVICE_URL: http://whatsapp:3001
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
    volumes:
      - .:/app
      - sqlite-data:/app/data
    depends_on:
      - redis

  ngrok:
    image: ngrok/ngrok:alpine
    command: http api:8000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"  # ngrok web interface
    depends_on:
      - api

volumes:
  sqlite-data:
  whatsapp-auth:
